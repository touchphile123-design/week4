<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slay girl</title>
    <style>
        .slay{
            min-width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: aliceblue;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: smaller;
            font-weight: bolder;
            flex-wrap: wrap;
        }
        .header{
            padding: 10px 24px;
            text-align: left;
            margin-top: 60px;
            width:58vw ;
            height: 40px;
            background-color: #1e90ff;
            display: flex;
            align-items: center;
            border-radius: 8px;
            border-bottom: 6px solid #0077ea;
        }
        .container{
            display: flex;
            flex-direction: row;
        }
        .main{
            flex-wrap: wrap;
             padding: 10px 24px;
             gap: 0.5rem;
            text-align: left;
            margin-top: 1rem;
            margin-right: 1rem;
            width: 40vw;
            height: 70vh;
            background-color:#3cb371;
            display: flex;
            align-items: flex-start;
            border-radius: 8px;
            border-bottom: 6px solid #2f8d59;
        }
        .sidebar{
             padding: 10px 24px;
            text-align: left;
            margin-top: 1rem;
            width: 10vw;
            height: 70vh;
            background-color:#ff6347;
            display: flex;
            align-items: flex-start;
            border-radius: 8px;
            border-bottom: 6px solid #e02200;
        }
        .footer{
             padding: 10px 24px;
            text-align: left;
             margin-top:1rem;
            width:58vw ;
            height: 40px;
            background-color: #4169e1;
            display: flex;
            align-items: center;
            border-radius: 8px;
            border-bottom: 6px solid #1d44b8;
        }
        .box-container{
            display: flex;
            flex-direction: row;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .item{
            text-align: center;
            justify-content: center;
             margin-top:1rem;
            width:70px ;
            height: 50px;
            background-color:#2f8d59;
            border-radius: 8px;
            border-bottom: 6px solid #226741 ;
        }
    </style>
</head>
<body>
    <div class="slay">
         <div class="header">header</div>
        <div class="container">
            <div class="main">main
                <div class="box-container">
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                </div>
            </div>
            <div class="sidebar">sidebar</div>
        </div>
        <div class="footer">footer</div>
    </div>
</body>
</html>
