<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex2</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
        }
        .box1{
            width: 3em;
            height: 400px;
            background-color: rgb(35, 82, 118);
        }
        .box2{
            width: 16em;
            height: 400px;
            background-color: rgb(81, 176, 193);
        }
         .box3{
            width: 3em;
            height: 400px;
            background-color: rgb(35, 82, 118);
        }
        .box4{
            width: 16em;
            height: 400px;
            background-color: rgb(246, 233, 173);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }
         .box5{
            width: 3em;
            height: 400px;
            background-color: rgb(35, 82, 118);
        }
        .insidebox1{
            width: 14em;
            height: 100px;
            background-color: aqua;
        }
        .insidebox2{
            width: 14em;
            height: 100px;
            background-color: aqua;
        }
        .insidebox3{
            width: 14em;
            height: 100px;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4">
                <div class="insidebox1"></div>
                <div class="insidebox2"></div>
                <div class="insidebox3"></div>
        </div>
        <div class="box5"></div>
    </div>
</body>
</html>
