<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
        }
        .box1{
            width: 10em;
            height: 400px;
            background-color: rgb(211, 107, 192);
        }
         .box2{
            height: 400px;
            width: 20em;
            background-color: rgb(117, 107, 107);
        }
         .box3{
            height: 400px;
            width: 10em;
            background-color:  rgb(211, 107, 192);
        }
        .insidebox2{
            width: 20em;
            height: 1em;
            background-color: rgb(107, 191, 107);
        }
        .insidebox4{
            width: 20em;
            height: 1em;
            background-color: rgb(130, 191, 130);
        }
        .insidebox1{
            width: 20em;
            height:100px;
            background-color: rgb(76, 82, 76);
        }
        .insidebox3{
            width: 20em;
            height:168px;
            background-color: rgb(76, 82, 76);
        }
        .insidebox5{
            width: 20em;
            height:100px;
            background-color: rgb(76, 82, 76);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2">
            <div class="insidebox1">header</div>
            <div class="insidebox2"></div>
            <div class="insidebox3">main</div>
            <div class="insidebox4"></div>
            <div class="insidebox5">footer</div>
        </div>
        <div class="box3"></div>
    </div>
</body>
</html>
